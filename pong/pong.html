// ══════════════════════════════════════════════════════════
//  ⑦ AUDIO (Web Audio API — sin archivos externos)
// ══════════════════════════════════════════════════════════
let ac = null;
function ensureAudio() {
  if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
}
function beep(freq, dur, type='square', vol=0.35) {
  if (!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.start(); o.stop(ac.currentTime+dur);
}
const SFX = {
  paddle:  ()=>beep(440,0.05,'square',0.4),
  wall:    ()=>beep(300,0.04,'square',0.3),
  point:   ()=>{ beep(220,0.1); setTimeout(()=>beep(160,0.18),110); },
  correct: ()=>{ beep(660,0.08); setTimeout(()=>beep(880,0.12),90); },
  wrong:   ()=>beep(140,0.22,'sawtooth',0.4),
  start:   ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.12),i*110)); },
  gameover:()=>{ [440,330,220,110].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'sawtooth'),i*160)); },
};

// ══════════════════════════════════════════════════════════
//  ⑧ DIBUJO — utilidades
// ══════════════════════════════════════════════════════════
function clear()       { ctx.fillStyle=gs.T.bg; ctx.fillRect(0,0,LW,LH); }
function overlay()     { ctx.fillStyle=gs.T.overlay; ctx.fillRect(0,0,LW,LH); }
function fillRect(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(~~x,~~y,w,h); }

function txt(str, x, y, size=18, color=null, align='left') {
  ctx.font       = `${size}px 'Orbitron',sans-serif`;
  ctx.fillStyle  = color||gs.T.text;
  ctx.textAlign  = align;
  ctx.fillText(str, x, y);
}

function wrapTxt(str, cx, y, maxW, size, color) {
  ctx.font=`${size}px 'Orbitron',sans-serif`;
  ctx.fillStyle=color||gs.T.text; ctx.textAlign='center';
  const words=str.split(' '); let line='', ly=y;
  for(const w of words){
    const t=line+(line?' ':'')+w;
    if(ctx.measureText(t).width>maxW && line){ ctx.fillText(line,cx,ly); line=w; ly+=size+5; }
    else line=t;
  }
  if(line) ctx.fillText(line,cx,ly);
  return ly+size+5;
}

function drawNet() {
  const seg=20, gap=10;
  ctx.fillStyle=gs.T.net;
  for(let y=0; y<LH; y+=seg+gap) ctx.fillRect(LW/2-2, y, 4, seg);
}

function drawHUD() {
  const p=gs.players;
  txt(p[0].score, LW/4, 56, 42, gs.T.score, 'center');
  txt(p[1].score, 3*LW/4, 56, 42, gs.T.score, 'center');
  // IDs truncados a 8 chars para que quepan con Orbitron
  const n0 = (gs.mode==='2p' ? (p[0].id||'J1') : 'TU').slice(0,8);
  const n1 = (gs.mode==='2p' ? (p[1].id||'J2') : 'CPU').slice(0,8);
  txt(n0, LW/4, 74, 11, gs.T.hud, 'center');
  txt(n1, 3*LW/4, 74, 11, gs.T.hud, 'center');
  const left=gs.cfg.ballsCount-gs.ballsPlayed;
  txt(`BOLAS: ${left}`, LW/2, 16, 10, gs.T.hud, 'center');
  txt('▼', gs.server===0?LW/4:3*LW/4, 88, 10, gs.T.accent, 'center');
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
  return array;
}

function pickQ() {
  const pool = gs.questions.filter(q => !gs.usedQIds.includes(String(q.id)));
  if (!pool.length) {
    gs.usedQIds = [];
    if (!gs.questions.length) return null;
    const randQ = gs.questions[~~(Math.random() * gs.questions.length)];
    gs.usedQIds.push(String(randQ.id));
    return randQ;
  }
  const q = pool[~~(Math.random() * pool.length)];
  gs.usedQIds.push(String(q.id));
  return q;
}

function getQOptions(q) {
  return q.type==='truefalse'
    ? [{k:'A',v:q.a},{k:'B',v:q.b}]
    : [{k:'A',v:q.a},{k:'B',v:q.b},{k:'C',v:q.c},{k:'D',v:q.d}].filter(o=>o.v);
}

// ══════════════════════════════════════════════════════════
//  ⑩ FÍSICA
// ══════════════════════════════════════════════════════════
function resetBall(server) {
  const b=gs.ball;
  b.x=LW/2; b.y=LH/2;
  b.spd = Math.min(5+gs.ballsPlayed*0.6, 14);
  const ang=(Math.random()*0.7-0.35);
  const dir=server===0?1:-1;
  b.vx=dir*b.spd*Math.cos(ang);
  b.vy=b.spd*Math.sin(ang);
  gs.rallies=0;
}

function updateBall() {
  const b=gs.ball, p=gs.pads;
  b.x+=b.vx; b.y+=b.vy;

  // Paredes superior / inferior
  if(b.y-b.sz/2<=0)  { b.y=b.sz/2;    b.vy=Math.abs(b.vy);  SFX.wall(); }
  if(b.y+b.sz/2>=LH) { b.y=LH-b.sz/2; b.vy=-Math.abs(b.vy); SFX.wall(); }

  // Paleta izquierda
  if(b.vx<0 && b.x-b.sz/2<=p[0].x+p[0].w && b.x-b.sz/2>=p[0].x &&
     b.y>=p[0].y-b.sz/2 && b.y<=p[0].y+p[0].h+b.sz/2) {
    b.x=p[0].x+p[0].w+b.sz/2;
    const rel=(b.y-(p[0].y+p[0].h/2))/(p[0].h/2);
    gs.rallies++; gs.lastHit=0;
    b.spd=Math.min(b.spd+0.3,18);
    b.vx= b.spd*Math.cos(rel*0.8);
    b.vy= b.spd*Math.sin(rel*0.8);
    SFX.paddle();
  }
  // Paleta derecha
  if(b.vx>0 && b.x+b.sz/2>=p[1].x && b.x+b.sz/2<=p[1].x+p[1].w &&
     b.y>=p[1].y-b.sz/2 && b.y<=p[1].y+p[1].h+b.sz/2) {
    b.x=p[1].x-b.sz/2;
    const rel=(b.y-(p[1].y+p[1].h/2))/(p[1].h/2);
    gs.rallies++; gs.lastHit=1;
    b.spd=Math.min(b.spd+0.3,18);
    b.vx=-(b.spd*Math.cos(rel*0.8));
    b.vy= b.spd*Math.sin(rel*0.8);
    SFX.paddle();
  }

  // Fuera de campo
  if(b.x < 0)  { awardPoint(1); return; }
  if(b.x > LW) { awardPoint(0); return; }
}

function updatePaddles() {
  const p=gs.pads, sp=6+gs.ballsPlayed*0.15;

  let j1Keyboard = false;
  let j2Keyboard = false;

  // J1 (izquierda) keyboard control
  if(gs.mode==='1p') {
    if (gs.keys['ArrowUp'] || gs.keys['ArrowDown']) {
      p[0].dy = gs.keys['ArrowUp']?-sp : sp;
      j1Keyboard = true;
    } else {
      p[0].dy = 0;
    }
  } else {
    if (gs.keys['w']||gs.keys['W']||gs.keys['s']||gs.keys['S']) {
      p[0].dy = (gs.keys['w']||gs.keys['W'])?-sp : sp;
      j1Keyboard = true;
    } else {
      p[0].dy = 0;
    }
    
    if (gs.keys['ArrowUp'] || gs.keys['ArrowDown']) {
      p[1].dy = gs.keys['ArrowUp']?-sp : sp;
      j2Keyboard = true;
    } else {
      p[1].dy = 0;
    }
  }

  // CPU (derecha en modo 1P)
  if(gs.mode==='1p') {
    const ctr=p[1].y+p[1].h/2;
    const diff=gs.ball.y-ctr;
    const cspd=Math.min(sp*(0.55+gs.ballsPlayed*0.07), sp*0.92);
    p[1].dy = Math.abs(diff)>4 ? Math.sign(diff)*cspd : 0;
  }

  // Apply keyboard movement
  if (j1Keyboard) {
    p[0].y=Math.max(0, Math.min(LH-p[0].h, p[0].y+p[0].dy));
  }
  if (j2Keyboard || gs.mode==='1p') {
    p[1].y=Math.max(0, Math.min(LH-p[1].h, p[1].y+p[1].dy));
  }

  // Apply touch / pointer control
  for (const id in gs.activePointers) {
    const pointer = gs.activePointers[id];
    if (pointer.x < LW / 2) {
      if (!j1Keyboard) {
        p[0].y = Math.max(0, Math.min(LH - p[0].h, pointer.y - p[0].h / 2));
      }
    } else {
      if (gs.mode === '2p' && !j2Keyboard) {
        p[1].y = Math.max(0, Math.min(LH - p[1].h, pointer.y - p[1].h / 2));
      }
    }
  }
}

function awardPoint(winner) {
  gs.players[winner].score++;
  gs.players[1-winner].errors++;
  gs.ballsPlayed++;
  gs.server=winner;
  SFX.point();
  setState(S.POINT);
}

// — Pregunta (sorteo, aleatoria, pre-saque) —
function renderQuestion() {
  const q=gs.currentQ; if(!q) return;
  clear(); drawNet();
  drawPaddle(0); drawPaddle(1);
  overlay();

  // Encabezado
  const phaseLabel = gs.qPhase==='sorting'   ? 'SORTEO DE SAQUE'  :
                     gs.qPhase==='pre_serve'  ? 'ANTES DE SACAR…'  : '⏸ PREGUNTA';
  txt(phaseLabel, LW/2, 34, 16, gs.T.accent, 'center');

  // Quién responde
  const askerName = gs.mode==='2p'
    ? (gs.players[gs.qAsker].id||`J${gs.qAsker+1}`)
    : (gs.qAsker===0?'TÚ':'CPU');
  const label = gs.qFirstWrong ? `TURNO → ${askerName}` : `RESPONDE: ${askerName}`;
  txt(label, LW/2, 58, 14, gs.T.hud, 'center');

  // Imagen (si hay)
  let yc=90;
  if(q.imageUrl) {
    if(!gs.qImages[q.id]) {
      const im=new Image(); im.src=q.imageUrl;
      gs.qImages[q.id]=im;
    }
    const im=gs.qImages[q.id];
    if(im.complete && im.naturalWidth>0) {
      const ih=110, iw=ih*(im.naturalWidth/im.naturalHeight||1.5);
      ctx.drawImage(im, LW/2-iw/2, yc, iw, ih);
      yc+=ih+10;
    }
  }

  // Texto de la pregunta
  yc = wrapTxt(q.question, LW/2, yc, LW-80, 19, gs.T.text) + 8;

  // Opciones
  const opts=getQOptions(q);
  opts.forEach((o,i)=>{
    const sel=gs.menuSel===i;
    if(sel) { ctx.fillStyle=gs.T.accent+'28'; ctx.fillRect(50,yc+i*46-6,LW-100,38); }
    txt(`${sel?'▶':' '} [${o.k}]  ${o.v}`, 70, yc+i*46+20, 18, sel?gs.T.accent:gs.T.text, 'left');
  });

  txt('↑↓ Seleccionar  ·  ENTER Confirmar', LW/2, LH-18, 12, gs.T.hud, 'center');
}

// — Resultado de pregunta —
function renderQResult() {
  clear(); drawNet(); drawPaddle(0); drawPaddle(1); overlay();
  const r=gs.qResult;
  const ok=r&&r.correct;
  txt(ok?'✓  CORRECTO':'✗  INCORRECTO', LW/2, LH/2-50, 36, ok?'#4caf50':'#f44336', 'center');
  if(r&&r.winner!==null) {
    const wn=gs.mode==='2p'
      ? (gs.players[r.winner].id||`J${r.winner+1}`)
      : (r.winner===0?'TÚ':'CPU');

function startRound() {
  gs.pads[0].y=LH/2-40; gs.pads[1].y=LH/2-40;
  SFX.start();
  launchBall();
}

function launchBall() {
  resetBall(gs.server);
  scheduleRandomQ();
  setState(S.PLAYING);
}

function scheduleRandomQ() {
  // dispara entre 18 y 38 segundos (1080–2280 frames a 60fps)
  gs.nextRandQ = gs.frame + 1080 + ~~(Math.random()*1200);
}

function handleAnswerResult(correct, stateAfter) {
  // En 1P: el jugador siempre responde; correcto=saca él, incorrecto=saca CPU
  // En 2P: lógica de turno cedido
  if(gs.mode==='1p') {
    const winner=correct?0:1;
    gs.server=winner;
    gs.qResult={ correct, winner };
    SFX[correct?'correct':'wrong']();
    setState(stateAfter);
    return;
  }
  // 2P
  if(!gs.qFirstWrong) {
    if(correct) {
      gs.server=gs.qAsker;
      gs.qResult={ correct:true, winner:gs.qAsker };
      SFX.correct();
      setState(stateAfter);
    } else {
      SFX.wrong();
      gs.qFirstWrong=true;
      gs.qAsker=1-gs.qAsker;
      gs.menuSel=0;
      // se queda en el estado de pregunta, ahora responde el otro
    }
  } else {
    // segundo turno
    if(correct) {
      gs.server=gs.qAsker;
      gs.qResult={ correct:true, winner:gs.qAsker };
      SFX.correct();
    } else {
      gs.server=Math.random()<0.5?0:1;
      gs.qResult={ correct:false, winner:gs.server };
      SFX.wrong();
    }
    setState(stateAfter);
  }
}

function resumeFromQResult() {
  if(gs.qPhase==='pre_serve' || gs.qPhase==='sorting') {
    startRound();
  } else {
    // pregunta aleatoria: reanudar partido
    scheduleRandomQ();
    setState(S.PLAYING);
  }
}

function initGame() {
  gs.players=[{id:'',score:0,errors:0},{id:'',score:0,errors:0}];
  gs.ballsPlayed=0; gs.server=0; gs.usedQIds=[];
  gs.pads[0].y=LH/2-40; gs.pads[1].y=LH/2-40;
}

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  gs.activePointers[e.pointerId] = { x: px, y: py };
  onTap(px, py);
});

canvas.addEventListener('pointermove', e => {
  if (gs.activePointers[e.pointerId]) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    gs.activePointers[e.pointerId] = {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }
});

const releasePointer = e => { delete gs.activePointers[e.pointerId]; };
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

document.addEventListener('keydown', e=>{
  gs.keys[e.key]=true;
  ensureAudio();
  onKey(e.key);
  // Prevenir scroll con flechas
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e=>{ gs.keys[e.key]=false; });

function confirmQOpt() {
  gs.withQ = gs.menuSel === 0 && gs.questions.length > 0;
  initGame();
  gs.players[0].id = gs.idInputs[0];
  gs.players[1].id = gs.mode==='2p' ? gs.idInputs[1] : 'CPU';
  if(gs.withQ) {
    gs.currentQ = pickQ(); gs.qPhase = 'sorting';
    gs.qAsker = 0; gs.qFirstWrong = false;
    setState(S.SORTING_Q);
  } else {
    gs.server = Math.random() < 0.5 ? 0 : 1;
    startRound();
  }
}

function drawNumpad() {
  const keys = [
    ['1', '2', '3'],
    ['4', '5', '6'],
    ['7', '8', '9'],
    ['CLR', '0', 'OK']
  ];
  const bw = 88, bh = 40, gap = 10;
  const startX = LW/2 - 150;
  const startY = 340;

  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 3; c++) {
      const bx = startX + c * (bw + gap);
      const by = startY + r * (bh + gap);
      const key = keys[r][c];

      ctx.strokeStyle = gs.T.net;
      ctx.lineWidth = 1;
      const inp = gs.idInputs[gs.idCursor];
      const isOK = key === 'OK';
      
      let fillCol = 'rgba(0,0,0,0.2)';
      let textCol = gs.T.text;
      
      if (isOK && inp.length >= 6) {
        ctx.strokeStyle = gs.T.accent;
        fillCol = gs.T.accent + '22';
        textCol = gs.T.accent;
      }
      
      ctx.fillStyle = fillCol;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeRect(bx, by, bw, bh);

      txt(key, bx + bw/2, by + 26, isOK ? 14 : 16, textCol, 'center');
    }
  }
}

function hitNumpad(x, y) {
  const keys = [
    ['1', '2', '3'],
    ['4', '5', '6'],
    ['7', '8', '9'],
    ['Backspace', '0', 'Enter']
  ];
  const bw = 88, bh = 40, gap = 10;
  const startX = LW/2 - 150;
  const startY = 340;

  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 3; c++) {
      const bx = startX + c * (bw + gap);
      const by = startY + r * (bh + gap);
      if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
        return keys[r][c];
      }
    }
  }
  return null;
}

function onTap(x, y) {
  const st = gs.state;

  if (st === S.TITLE) {
    setState(S.MODE);
    return;
  }

  if (st === S.MODE) {
    if (y >= 210 && y < 282) {
      gs.mode = '1p';
      gs.idInputs = ['', '']; gs.idCursor = 0;
      setState(S.PLAYER_ID);
    } else if (y >= 282 && y <= 350) {
      gs.mode = '2p';
      gs.idInputs = ['', '']; gs.idCursor = 0;
      setState(S.PLAYER_ID);
    }
    return;
  }

  if (st === S.PLAYER_ID) {
    const key = hitNumpad(x, y);
    if (key) onKey(key);
    return;
  }

  if (st === S.Q_OPT) {
    if (y >= 230 && y < 300) {
      gs.menuSel = 0;
      confirmQOpt();
    } else if (y >= 300 && y <= 370) {
      gs.menuSel = 1;
      confirmQOpt();
    }
    return;
  }

  if (st === S.SORTING_Q || st === S.QUESTION) {
    const q = gs.currentQ;
    if (!q) return;
    let yc = 90;
    if (q.imageUrl) {
      const im = gs.qImages[q.id];
      if (im && im.complete && im.naturalWidth > 0) {
        const ih = 110;
        yc += ih + 10;
      }
    }
    ctx.font = `19px 'Orbitron',sans-serif`;
    const words = q.question.split(' ');
    let line = '';
    let ly = yc;
    for (const w of words) {
      const t = line + (line ? ' ' : '') + w;
      if (ctx.measureText(t).width > (LW - 80) && line) {
        line = w; ly += 24;
      } else {
        line = t;
      }
    }
    yc = ly + 24 + 8;

    const opts = getQOptions(q);
    for (let i = 0; i < opts.length; i++) {
      const optY = yc + i * 46;
      if (y >= optY - 6 && y <= optY + 32 && x >= 50 && x <= LW - 50) {
        const chosen = ['a', 'b', 'c', 'd'][i];
        handleAnswerResult(chosen === q.correct, st === S.SORTING_Q ? S.SORTING_RESULT : S.Q_RESULT);
        break;
      }
    }
    return;
  }

  if (st === S.POINT) {
    if (elapsed() > 60) {
      onKey('Enter');
    }
    return;
  }

  if (st === S.GAME_OVER) {
    if (y >= 350 && y <= 500) {
      if (x < LW / 2) {
        onKey('Enter');
      } else {
        onKey('Escape');
      }
    }
    return;
  }

  if (st === S.LEADERBOARD) {
    onKey('Escape');
    return;
  }
}

function onKey(key) {
  // Toggle tema
  if(key==='d'||key==='D') {
    gs.theme=gs.theme==='night'?'day':'night';
    gs.T=THEMES[gs.theme]; return;
  }

  const st=gs.state;

  // ESC global
  if(key==='Escape') {
    if(st===S.GAME_OVER||st===S.LEADERBOARD){ initGame(); setState(S.TITLE); }
    return;
  }

  if(st===S.TITLE) {
    if(key==='Enter') setState(S.MODE);
    return;
  }

  if(st===S.MODE) {
    if(key==='ArrowUp')   gs.menuSel=Math.max(0,gs.menuSel-1);
    if(key==='ArrowDown') gs.menuSel=Math.min(1,gs.menuSel+1);
    if(key==='Enter') {
      gs.mode=gs.menuSel===0?'1p':'2p';
      gs.idInputs=['','']; gs.idCursor=0;
      setState(S.PLAYER_ID);
    }
    return;
  }

  if(st===S.PLAYER_ID) {
    const max=gs.mode==='2p'?1:0;
    if(key==='Backspace') gs.idInputs[gs.idCursor]=gs.idInputs[gs.idCursor].slice(0,-1);
    else if(/^\d$/.test(key)&&gs.idInputs[gs.idCursor].length<12)
      gs.idInputs[gs.idCursor]+=key;
    else if(key==='Enter'&&gs.idInputs[gs.idCursor].length>=6) {
      gs.players[gs.idCursor].id=gs.idInputs[gs.idCursor];
      if(gs.idCursor<max) gs.idCursor++;
      else setState(S.Q_OPT);
    }
    return;
  }

  if(st===S.Q_OPT) {
    if(key==='ArrowUp')   gs.menuSel=Math.max(0,gs.menuSel-1);
    if(key==='ArrowDown') gs.menuSel=Math.min(1,gs.menuSel+1);
    if(key==='Enter') {
      confirmQOpt();
    }
    return;
  }

  if(st===S.SORTING_Q) {
    const opts=getQOptions(gs.currentQ);
    if(key==='ArrowUp')   gs.menuSel=Math.max(0,gs.menuSel-1);
    if(key==='ArrowDown') gs.menuSel=Math.min(opts.length-1,gs.menuSel+1);
    if(key==='Enter') {
      const chosen=['a','b','c','d'][gs.menuSel];
      handleAnswerResult(chosen===gs.currentQ.correct, S.SORTING_RESULT);
    }
    return;
  }

  // SORTING_RESULT y Q_RESULT: auto-avanzan, no necesitan ENTER

  if(st===S.QUESTION) {
    const opts=getQOptions(gs.currentQ);
    if(key==='ArrowUp')   gs.menuSel=Math.max(0,gs.menuSel-1);
    if(key==='ArrowDown') gs.menuSel=Math.min(opts.length-1,gs.menuSel+1);
    if(key==='Enter') {
      const chosen=['a','b','c','d'][gs.menuSel];
      handleAnswerResult(chosen===gs.currentQ.correct, S.Q_RESULT);
    }
    return;
  }

  if(st===S.POINT) {
    if((key==='Enter'||key===' ')&&elapsed()>60) {
      if(gs.ballsPlayed>=gs.cfg.ballsCount) {
        SFX.gameover(); setState(S.GAME_OVER); saveScores();
      } else if(gs.withQ&&gs.questions.length>0) {
        gs.currentQ=pickQ(); gs.qPhase='pre_serve';
        gs.qAsker=gs.server; gs.qFirstWrong=false;
        setState(S.QUESTION);
      } else {
        launchBall();
      }
    }
    return;
  }

  if(st===S.GAME_OVER) {
    if(key==='Enter') { loadScores(); setState(S.LEADERBOARD); }
    if(key==='Escape') { initGame(); setState(S.TITLE); }
    return;
  }
}

function fetchJSONP(url) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
    script.onerror = () => {
      delete window[callbackName];
      document.body.removeChild(script);
      reject(new Error('Error al cargar JSONP desde ' + url));
    };
    document.body.appendChild(script);
  });
}

async function loadFromSheets() {
  let configData = null;
  let questionsData = null;
  let scoresData = null;

  // Intento 1: Fetch estándar (CORS)
  try {
    const [cfgR, qR, scR] = await Promise.all([
      fetch(APPS_SCRIPT_URL+'?action=config'),
      fetch(APPS_SCRIPT_URL+'?action=questions'),
      fetch(APPS_SCRIPT_URL+'?action=scores'),
    ]);
    if(cfgR.ok) {
      const d = await cfgR.json();
      if(d.ok) configData = d.data;
    }
    if(qR.ok) {
      const d = await qR.json();
      if(d.ok) questionsData = d.data;
    }
    if(scR.ok) {
      const d = await scR.json();
      if(d.ok) scoresData = d.data;
    }
  } catch(e) {
    console.warn('[PONG] Fetch estándar falló (posible restricción file:// o CORS). Intentando JSONP...', e.message);
  }

  // Intento 2: Fallback a JSONP (Súper compatible con file://)
  if (!configData || !questionsData || !scoresData) {
    try {
      const [cfgD, qD, scD] = await Promise.all([
        fetchJSONP(APPS_SCRIPT_URL+'?action=config'),
        fetchJSONP(APPS_SCRIPT_URL+'?action=questions'),
        fetchJSONP(APPS_SCRIPT_URL+'?action=scores'),
      ]);
      if(cfgD && cfgD.ok) configData = cfgD.data;
      if(qD && qD.ok) questionsData = qD.data;
      if(scD && scD.ok) scoresData = scD.data;
      console.log('[PONG] Carga exitosa mediante JSONP');
    } catch(err2) {
      console.error('[PONG] Fallback de JSONP también falló:', err2.message);
    }
  }

  // Procesar configuración cargada
  if (configData) {
    const c = configData;
    if(c.titleMain)  gs.cfg.titleMain  = c.titleMain;
    if(c.titleSub)   gs.cfg.titleSub   = c.titleSub;
    if(c.ballsCount) gs.cfg.ballsCount  = parseInt(c.ballsCount)||5;
    if(c.night_bg)     THEMES.night.bg      = c.night_bg;
    if(c.night_paddle) THEMES.night.paddle   = c.night_paddle;
    if(c.night_ball)   THEMES.night.ball     = c.night_ball;
    if(c.night_accent) THEMES.night.accent   = c.night_accent;
    if(c.day_bg)       THEMES.day.bg         = c.day_bg;
    if(c.day_paddle)   THEMES.day.paddle     = c.day_paddle;
    if(c.day_ball)     THEMES.day.ball       = c.day_ball;
    if(c.day_accent)   THEMES.day.accent     = c.day_accent;
    gs.T=THEMES[gs.theme];
  }

  if (questionsData && questionsData.length) {
    gs.questions = shuffle(questionsData);
    console.log('[PONG] Preguntas reales cargadas desde Sheets:', gs.questions.length);
  } else {
    gs.questions = shuffle([...DEMO_Q]);
    console.log('[PONG] Usando preguntas de demo (local).');
  }

  if (scoresData) {
    gs.scores = scoresData;
    console.log('[PONG] Scores cargados:', gs.scores.length);
  }

  setState(S.TITLE);
}

async function loadScores() {
  try {
    // Intentar con fetch estándar
    const r=await fetch(APPS_SCRIPT_URL+'?action=scores');
    if(r.ok){ const d=await r.json(); if(d.ok) { gs.scores=d.data; return; } }
  } catch(e){}

  // Fallback a JSONP
  try {
    const d = await fetchJSONP(APPS_SCRIPT_URL+'?action=scores');
    if(d.ok) gs.scores = d.data;
  } catch(e) {
    console.warn('[PONG] No se pudieron cargar los scores de ninguna manera');
  }
}

async function saveScores() {
  for(const pl of gs.players) {
    if(!pl.id || pl.id==='CPU') continue;
    const params = new URLSearchParams({
      action:   'saveScore',
      playerID:  pl.id,
      score:     pl.score,
      errors:    pl.errors,
      mode:      gs.mode==='1p'?'1P':'2P',
      withQ:     gs.withQ?'con-preguntas':'clasico',
      date:      new Date().toISOString().slice(0,10),
    });
    const url = `${APPS_SCRIPT_URL}?${params}`;
    console.log('[PONG] saveScore URL →', url);

    let saved = false;
    // Intento 1: fetch GET con CORS estándar
    try {
      const r = await fetch(url, { redirect:'follow' });
      const d = await r.json();
      console.log('[PONG] saveScore respuesta (CORS):', d);
      saved = d.ok === true;
    } catch(e) {
      console.warn('[PONG] fetch CORS falló, intentando con JSONP:', e.message);
    }

    // Intento 2: JSONP (Súper compatible con file://, sigue redirecciones)
    if(!saved) {
      try {
        console.log('[PONG] Intentando guardar con JSONP...');
        const d = await fetchJSONP(url);
        saved = d.ok === true;
        console.log('[PONG] Score guardado mediante JSONP');
      } catch(err2) {
        console.warn('[PONG] Guardado por JSONP falló:', err2.message);
      }
    }

    // Intento 3: Image() — fallback heredado por compatibilidad
    if(!saved) {
      console.log('[PONG] Intentando con Image()...');
      await new Promise(resolve => {
        const img = new Image();
        img.onload = img.onerror = () => { console.log('[PONG] Image() completado'); resolve(); };
        img.src = url + '&_nocors=1';
        setTimeout(resolve, 5000);
      });
    }
  }

  // Dar 2 segundos a Sheets para procesar antes de recargar
  await new Promise(r => setTimeout(r, 2000));
  await loadScores();
  console.log('[PONG] Scores recargados:', gs.scores.length, 'entradas');
}

//  ⑮ BUCLE PRINCIPAL

function loop() {
  requestAnimationFrame(loop);
  gs.frame++;
  const st=gs.state;

  if(st===S.LOADING)          { renderLoading();   return; }
  if(st===S.TITLE)            { renderTitle();     return; }
  if(st===S.MODE)             { renderMode();      return; }
  if(st===S.PLAYER_ID)        { renderPlayerID();  return; }
  if(st===S.Q_OPT)            { renderQOpt();      return; }
  if(st===S.SORTING_Q||st===S.QUESTION) { renderQuestion(); return; }
  if(st===S.SORTING_RESULT||st===S.Q_RESULT) {
    renderQResult();
    if(elapsed()>150) resumeFromQResult(); // auto-avance tras 2.5s
    return;
  }
  if(st===S.PLAYING) {
    updatePaddles();
    updateBall();
    renderPlaying();
    // Pregunta aleatoria
    if(gs.withQ&&gs.questions.length&&gs.frame>=gs.nextRandQ) {
      gs.currentQ=pickQ(); gs.qPhase='random';
      gs.qAsker=gs.lastHit; gs.qFirstWrong=false;
      setState(S.QUESTION);
    }
    return;
  }
  if(st===S.POINT)       { renderPoint();       return; }
  if(st===S.GAME_OVER)   { renderGameOver();    return; }
  if(st===S.LEADERBOARD) { renderLeaderboard(); return; }
}

// ══════════════════════════════════════════════════════════
//  ⑯ INICIO
// ══════════════════════════════════════════════════════════
setState(S.LOADING);
loadFromSheets();
requestAnimationFrame(loop);
</script>
</body>
</html>
